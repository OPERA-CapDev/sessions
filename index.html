<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPERA Webinars</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{--navy:#00125C;--blue:#1A54EB;--teal:#18BAA8;--gold:#FFCC03;--bg:#F4F6FB;--panel:#fff;--fg:#17203A;--muted:#5b6478;--line:#e2e7f1;--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.55}
  .wrap{max-width:960px;margin:0 auto;padding:0 18px}
  header{background:var(--navy);color:#fff;padding:30px 0 26px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .tag{display:inline-block;background:rgba(24,186,168,.18);color:var(--teal);font-weight:700;font-size:11px;letter-spacing:.09em;padding:4px 13px;border-radius:20px;margin-bottom:12px}
  h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:0 0 6px}
  .sub{color:#c7d0ee;font-size:14px;margin:0}
  .hero{position:relative}
  .langsw{position:absolute;top:36px;right:14px;z-index:2;display:flex;border:1px solid rgba(255,255,255,.45);border-radius:30px;overflow:hidden;background:rgba(0,18,92,.8);backdrop-filter:blur(4px)}
  .langsw button{background:transparent;color:#c7d0ee;border:0;font-family:var(--display);font-weight:700;font-size:13px;padding:8px 18px;cursor:pointer;letter-spacing:.04em}
  .langsw button[aria-pressed="true"]{background:var(--teal);color:#fff}
  .teal{height:4px;background:var(--teal)}
  .intro{font-size:15px;color:var(--fg);margin:26px 0 8px;max-width:640px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:20px 0 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px;padding:20px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(10,20,50,.05)}
  .card.today{border-top-color:var(--gold);box-shadow:0 4px 16px rgba(26,84,235,.12)}
  .daynum{font-family:var(--display);font-weight:800;font-size:13px;color:var(--teal);letter-spacing:.06em;text-transform:uppercase}
  .date{font-size:12px;color:var(--muted);margin:2px 0 10px}
  .card h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 6px;color:var(--navy);line-height:1.2}
  .card p{font-size:13.5px;color:var(--muted);margin:0 0 16px;flex:1}
  .btn{display:inline-block;text-align:center;background:var(--teal);color:#fff !important;text-decoration:none;font-family:var(--display);font-weight:700;font-size:14px;padding:11px 18px;border-radius:8px}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent;color:var(--navy) !important;border:1px solid var(--line);margin-top:8px;font-size:13px;padding:9px 18px}
  .workshop{background:#eef1fa;border:1px dashed #c3ccea;border-radius:12px;padding:18px 20px;margin:14px 0 30px}
  .workshop b{font-family:var(--display);color:var(--navy);font-size:15px}
  .workshop span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:12.5px;line-height:1.7}
  footer a{color:var(--teal);text-decoration:none}
  footer .org{font-weight:700;color:var(--navy);font-family:var(--display);margin-bottom:4px}
  @media(max-width:560px){h1{font-size:24px}}
  .banner{display:block;width:100%;height:auto;border-radius:14px;margin:24px 0 4px;box-shadow:0 2px 10px rgba(10,20,50,.08)}
  .footerband{display:block;width:100%;height:auto;border-radius:14px;margin:6px 0 34px}
</style>
</head>

    $('#btnEn').setAttribute('aria-pressed', lang==='en');
    $('#btnFr').setAttribute('aria-pressed', lang==='fr');
    try { localStorage.setItem('opera-lang', lang); } catch(e){}
  }

  let lang = 'en';
  try { const s = localStorage.getItem('opera-lang'); if (s==='fr'||s==='en') lang = s; } catch(e){}
  if ((location.hash||'').toLowerCase().includes('fr')) lang='fr';
  render(lang);
  document.querySelectorAll('.langsw button').forEach(b => b.onclick = () => render(b.dataset.lang));
})();
</script>
</body>
</html>
